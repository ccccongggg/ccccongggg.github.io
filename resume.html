<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>印贤聪 · 个人简历（实习投递）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --ink: #23201C; --sub: #5F5850; --orange: #D96A12; --line: #E3DCD2; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #EFEAE2;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.62;
  }
  .page {
    width: 210mm;
    min-height: 296mm;
    margin: 24px auto;
    background: #fff;
    padding: 12mm 14mm;
    box-shadow: 0 6px 30px rgba(0,0,0,.12);
  }

  /* ===== 头部 ===== */
  .head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--orange); padding-bottom: 10px; }
  .head h1 { font-size: 29px; letter-spacing: 6px; }
  .head .job { font-size: 14px; color: var(--orange); font-weight: 700; margin-top: 4px; letter-spacing: 1px; }
  .head .contact { text-align: right; font-size: 12px; color: var(--sub); line-height: 1.8; }
  .head .contact b { color: var(--ink); }

  /* ===== 区块 ===== */
  h2 { font-size: 14.5px; color: var(--orange); letter-spacing: 2px; margin: 12px 0 6px; display: flex; align-items: center; gap: 8px; }
  h2::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .edu-row { display: flex; justify-content: space-between; font-size: 13.5px; }
  .edu-row b { font-size: 14px; }
  .edu-sub { color: var(--sub); font-size: 12.5px; }

  .item { margin-bottom: 9px; }
  .item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .item-head b { font-size: 13.6px; }
  .item-head span { font-size: 11.8px; color: var(--sub); white-space: nowrap; }
  .desc { margin-top: 2px; font-size: 12.2px; line-height: 1.58; color: #33302B; text-align: justify; }

  .honors-line { font-size: 12.4px; line-height: 1.75; }

  .skills { display: grid; grid-template-columns: 84px 1fr; gap: 3px 12px; font-size: 12.5px; }
  .skills b { color: var(--sub); font-weight: 500; }

  .self { font-size: 12.5px; text-align: justify; }

  .print-bar { max-width: 210mm; margin: 0 auto 10px; text-align: right; }
  .note { max-width: 210mm; margin: 0 auto 24px; font-size: 12px; color: var(--sub); text-align: right; }

  /* 顶部操作按钮 */
  .top-actions { position: fixed; top: 18px; right: 18px; z-index: 50; display: flex; gap: 10px; }
  .dl-btn {
    background: var(--orange); color: #fff; border: 0; border-radius: 999px;
    padding: 10px 20px; font-size: 13px; cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 24px rgba(217, 106, 18, 0.35);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .dl-btn:hover { transform: translateY(-1px); }
  .dl-btn[disabled] { opacity: 0.6; cursor: wait; transform: none; }

  .loading { text-align: center; color: var(--sub); padding: 60px 0; font-size: 13px; }

  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    .page { margin: 0; box-shadow: none; width: auto; min-height: auto; padding: 12mm 14mm; }
    .print-bar, .note { display: none; }
    .top-actions { display: none !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="top-actions">
  <button class="dl-btn" id="dl-btn" type="button">下载 PDF（电子版）</button>
  <button class="dl-btn" id="print-btn" type="button">打印纸质版</button>
</div>

<div class="page" id="resume-page"><div class="loading">正在从网站数据生成简历…</div></div>

<div class="note" id="resume-note"></div>

<script src="content.js"></script>
<script>
(function () {
  'use strict';

  var C = window.SITE_CONTENT;

  /* 本地预览兼容：content.js 在 personal-site/ 子目录时自动补载 */
  function boot() {
    if (C && C.data) { render(); return; }
    var s = document.createElement('script');
    s.src = 'personal-site/content.js';
    s.onload = function () { C = window.SITE_CONTENT; render(); };
    s.onerror = function () {
      document.getElementById('resume-page').innerHTML =
        '<div class="loading">未能加载 content.js（请确认它与本页在同一目录）</div>';
    };
    document.head.appendChild(s);
  }

  function t(o) { return o && typeof o === 'object' ? (o.zh || '') : (o || ''); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function render() {
    var d = C.data;
    var c = d.contact || {};
    var r = d.resume || {};
    var tl = (d.timeline || []).slice();
    var edu = null;
    for (var i = 0; i < tl.length; i++) { if (tl[i].current) { edu = tl[i]; break; } }
    if (!edu) { edu = tl[tl.length - 1]; }
    var exps = tl.filter(function (x) { return x !== edu; });

    var html = '';

    /* 头部 */
    html += '<div class="head"><div>' +
      '<h1>' + esc(t(d.name)) + '</h1>' +
      '<div class="job">求职意向：' + esc(t(r.jobTitle) || '实习') + '</div>' +
      '</div><div class="contact">' +
      '<b>' + esc(c.phone || '') + '</b> ｜ ' + esc(c.email || '') + '<br>' +
      esc(t(c.city) || '') + (r.political ? ' ｜ 政治面貌：' + esc(t(r.political)) : '') + '<br>' +
      'GitHub：' + esc((c.github || '').replace(/^https?:\/\//, '')) +
      '</div></div>';

    /* 教育背景 */
    if (edu) {
      html += '<h2>教育背景</h2>' +
        '<div class="edu-row"><span><b>' + esc(t(edu.title)) + '</b></span>' +
        '<span class="edu-sub">' + esc(t(edu.when)) + '</span></div>' +
        '<div class="edu-sub">' + esc(t(edu.org)) + '</div>';
    }

    /* 竞赛与项目经历（来自网站「经历」板块） */
    if (exps.length) {
      html += '<h2>竞赛与项目经历</h2>';
      exps.forEach(function (x) {
        html += '<div class="item">' +
          '<div class="item-head"><b>' + esc(t(x.title)) + '</b>' +
          '<span>' + esc(t(x.when)) + (x.org ? ' ｜ ' + esc(t(x.org)) : '') + '</span></div>' +
          '<p class="desc">' + esc(t(x.desc)) + '</p>' +
          '</div>';
      });
    }

    /* 荣誉奖项（来自网站「荣誉与背书」板块） */
    var certs = d.certs || [];
    if (certs.length) {
      html += '<h2>荣誉奖项</h2><div class="honors-line">' +
        certs.map(function (x) {
          var y = x.year && x.year !== '—' ? '（' + x.year + '）' : '';
          return esc(t(x.name)) + y;
        }).join(' · ') +
        '</div>';
    }

    /* 专业技能（来自网站「技能」板块） */
    var skills = d.skills || [];
    if (skills.length) {
      html += '<h2>专业技能</h2><div class="skills">';
      skills.forEach(function (g) {
        html += '<b>' + esc(t(g.name)) + '</b><span>' +
          (g.items || []).map(function (it) { return esc(t(it.name)); }).join(' · ') +
          '</span>';
      });
      html += '</div>';
    }

    /* 自我评价（简历专属字段） */
    if (r.selfEval) {
      html += '<h2>自我评价</h2><p class="self">' + esc(t(r.selfEval)) + '</p>';
    }

    document.getElementById('resume-page').innerHTML = html;
    document.getElementById('resume-note').innerHTML =
      '※ 本简历由个人网站数据实时生成，与网站内容始终一致。右上角：<b>下载 PDF</b>（电子版投递）· <b>打印纸质版</b>（当面递交，已预设 A4）。';
  }

  /* ===== PDF 生成（纯前端 JPEG → 单页 A4 PDF） ===== */
  function jpegBase64ToPdf(jpegB64, wPx, hPx) {
    var jpeg = atob(jpegB64);
    var parts = [];
    var offset = 0, offsets = [0];
    function push(s) { parts.push(s); offset += s.length; }
    var pageW = 595.28, pageH = 841.89;
    push('%PDF-1.4\n');
    offsets[1] = offset; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    offsets[2] = offset; push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
    offsets[3] = offset; push('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageW + ' ' + pageH + '] /Resources << /XObject << /Im1 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>\nendobj\n');
    offsets[4] = offset; push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + wPx + ' /Height ' + hPx + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>\nstream\n');
    push(jpeg);
    push('\nendstream\nendobj\n');
    var content = 'q\n' + pageW + ' 0 0 ' + pageH + ' 0 0 cm\n/Im1 Do\nQ';
    offsets[5] = offset; push('5 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream\nendobj\n');
    var xrefStart = offset;
    var xref = 'xref\n0 6\n0000000000 65535 f \n';
    for (var n = 1; n <= 5; n++) xref += String(offsets[n]).padStart(10, '0') + ' 00000 n \n';
    xref += 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF';
    push(xref);
    var pdfStr = parts.join('');
    var bytes = new Uint8Array(pdfStr.length);
    for (var i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
    return bytes;
  }

  var busy = false;
  function downloadPdf() {
    if (busy) return;
    var btn = document.getElementById('dl-btn');
    if (typeof html2canvas === 'undefined') { alert('渲染库加载失败，请检查网络后重试'); return; }
    busy = true;
    btn.disabled = true;
    btn.textContent = '正在生成 PDF…';
    html2canvas(document.querySelector('.page'), { scale: 2, backgroundColor: '#FFFFFF', logging: false })
      .then(function (canvas) {
        var bytes = jpegBase64ToPdf(canvas.toDataURL('image/jpeg', 0.92).split(',')[1], canvas.width, canvas.height);
        var blob = new Blob([bytes], { type: 'application/pdf' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (C && C.data ? t(C.data.name) : '简历') + '-简历.pdf';
        document.body.appendChild(a);
        a.click();
        a.remove();
        btn.textContent = '✓ 已下载';
        setTimeout(function () { btn.textContent = '下载 PDF（电子版）'; btn.disabled = false; busy = false; }, 1600);
      })
      .catch(function (e) {
        btn.textContent = '下载 PDF（电子版）';
        busy = false;
        alert('生成失败：' + (e && e.message ? e.message : '未知错误'));
      });
  }

  document.getElementById('dl-btn').addEventListener('click', downloadPdf);
  document.getElementById('print-btn').addEventListener('click', function () { window.print(); });

  if (new URLSearchParams(location.search).get('autodownload') === '1') {
    setTimeout(downloadPdf, 1000);
  }

  boot();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
</html>
